<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3270</title>
    <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #16213e;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #0f3460;
        }

        header h1 { font-size: 1rem; color: #a0c4ff; letter-spacing: 1px; }

        #connect-form { display: flex; gap: 8px; align-items: center; flex: 1; }
        #connect-form.hidden { display: none; }

        #server-select {
            background: #0f3460;
            border: 1px solid #1a4a8a;
            color: #e0e0e0;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            min-width: 200px;
            cursor: pointer;
        }

        #server-select option { background: #16213e; }

        button {
            background: #0f3460;
            color: #a0c4ff;
            border: 1px solid #1a4a8a;
            padding: 5px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        button:hover    { background: #1a4a8a; }
        button:disabled { opacity: 0.4; cursor: default; }

        #status {
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 10px;
            background: #333;
            color: #888;
            white-space: nowrap;
        }

        #status.connected  { background: #1a3a1a; color: #4caf50; }
        #status.connecting { background: #2a2a1a; color: #ffc107; }
        #status.error      { background: #3a1a1a; color: #f44336; }

        #terminal-container {
            flex: 1;
            overflow: hidden;
            background: #0d0d1a;
            display: flex;
            flex-direction: column;
        }

        #terminal { flex: 1; overflow: hidden; }

        /* xterm.js leaves a sub-row gap — match its background so it's invisible */
        #terminal .xterm-viewport { background: transparent !important; }
        #terminal .xterm-screen canvas { display: block; }
    </style>
</head>
<body>
    <header>
        <h1>Web3270</h1>
        <form id="connect-form" onsubmit="return false;">
            <select id="server-select">
                <option value="">Loading servers…</option>
            </select>
            <button id="connect-btn" type="submit">Connect</button>
            <button id="disconnect-btn" type="button" disabled>Disconnect</button>
        </form>
        <span id="status">Disconnected</span>
    </header>

    <div id="terminal-container">
        <div id="terminal"></div>
    </div>

    <script src="/vendor/xterm/lib/xterm.js"></script>
    <script src="/vendor/addon-fit/lib/addon-fit.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
</body>
</html>
