services:
  web3270:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DEFAULT_SERVER=local
      - LOCAL_MAINFRAME_HOST=mvs
      - LOCAL_MAINFRAME_PORT=3270
    depends_on:
      - mvs

  mvs:
    image: rattydave/docker-ubuntu-hercules-mvs
    ports:
      - "2323:3270"   # TN3270 (container listens on 3270, exposed as 2323)
      - "8038:8038"   # Hercules web console (optional)
